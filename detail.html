<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Disaster Guidelines</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="detail-header">
        <a href="disasters.html" class="back-button">
            ← Back to Disasters
        </a>
    </header>


    <!-- Disaster Details -->
    <main class="detail-container">

        <section class="detail-intro">

            <div>
                <p class="section-label">DISASTER MANAGEMENT</p>

                <h1 id="disaster-name">Disaster</h1>

                <p id="disaster-introduction" class="introduction"></p>
            </div>

            <img id="disaster-image" src="" alt="Disaster image">

        </section>


        <!-- Causes -->
        <section class="detail-section">

            <h2>Causes</h2>

            <ul id="causes"></ul>

        </section>


        <!-- Warning Signs -->
        <section class="detail-section" id="warning-section">

            <h2>Warning Signs</h2>

            <ul id="warning-signs"></ul>

        </section>


        <!-- Safety Guidelines -->
        <section class="detail-section">

            <h2>Safety Guidelines</h2>

            <div class="safety-grid">

                <div class="safety-box">
                    <h3>BEFORE</h3>
                    <ul id="before"></ul>
                </div>

                <div class="safety-box">
                    <h3>DURING</h3>
                    <ul id="during"></ul>
                </div>

                <div class="safety-box">
                    <h3>AFTER</h3>
                    <ul id="after"></ul>
                </div>

            </div>

        </section>


        <!-- DOs and DON'Ts -->
        <section class="detail-section">

            <div class="dos-donts">

                <div class="do-box">
                    <h2>DOs</h2>
                    <ul id="dos"></ul>
                </div>

                <div class="dont-box">
                    <h2>DON'Ts</h2>
                    <ul id="donts"></ul>
                </div>

            </div>

        </section>


        <!-- Bottom Back Button -->
        <div class="bottom-back">
            <a href="disasters.html">
                ← Back to Disaster List
            </a>
        </div>

    </main>


    <script src="script.js"></script>

</body>
</html>
